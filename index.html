<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyForge AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            color: white;
            background:
                radial-gradient(circle at top left, #6d28d9 0%, transparent 35%),
                radial-gradient(circle at bottom right, #2563eb 0%, transparent 35%),
                #09090f;
        }

        .app {
            width: 100%;
            max-width: 1000px;
            margin: auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 25px;
        }

        header {
            text-align: center;
            padding: 20px 0 25px;
        }

        header h1 {
            font-size: 38px;
            margin-bottom: 8px;
        }

        header p {
            color: #b8b8c8;
            font-size: 16px;
        }

        .credits {
            margin: 15px auto 0;
            width: fit-content;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #d8d0ff;
            font-size: 14px;
        }

        .credits span {
            color: #ffffff;
            font-weight: bold;
        }

        .welcome {
            text-align: center;
            margin: 30px 0 25px;
        }

        .welcome h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #aaaabd;
        }

        .suggestions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 25px;
        }

        .suggestion {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 18px;
            color: #ddd;
            cursor: pointer;
            transition: 0.2s;
        }

        .suggestion:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        .chat {
            flex: 1;
            min-height: 250px;
            max-height: 500px;
            overflow-y: auto;
            padding: 10px 0;
        }

        .message {
            margin-bottom: 18px;
            padding: 16px 18px;
            border-radius: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .user-message {
            background: #5b21b6;
            margin-left: auto;
            max-width: 80%;
        }

        .ai-message {
            background: rgba(255, 255, 255, 0.08);
            max-width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .input-area {
            position: sticky;
            bottom: 0;
            padding-top: 15px;
            background: linear-gradient(
                transparent,
                #09090f 25%
            );
        }

        .input-box {
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 10px;
        }

        textarea {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 16px;
            padding: 10px;
            min-height: 50px;
            font-family: inherit;
        }

        textarea::placeholder {
            color: #88889b;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 0 20px;
            background: #7c3aed;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #8b5cf6;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .clear-btn {
            display: block;
            margin: 10px auto 0;
            padding: 8px 14px;
            background: transparent;
            color: #999;
            font-size: 13px;
        }

        .clear-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
        }

        .loading {
            color: #aaaabd;
            font-style: italic;
        }

        @media (max-width: 700px) {
            .app {
                padding: 15px;
            }

            header h1 {
                font-size: 30px;
            }

            .suggestions {
                grid-template-columns: 1fr;
            }

            .user-message,
            .ai-message {
                max-width: 95%;
            }

            .input-box {
                flex-direction: column;
            }

            button {
                min-height: 45px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header>
        <h1>StudyForge AI</h1>
        <p>Your personal study companion.</p>

        <div class="credits">
            Free questions remaining:
            <span id="credits">10</span>
        </div>
    </header>

    <div class="welcome" id="welcome">
        <h2>Ready to learn?</h2>
        <p>Ask StudyForge anything related to your studies.</p>
    </div>

    <div class="suggestions" id="suggestions">

        <div class="suggestion" onclick="useSuggestion('Explain Newton\\'s second law simply.')">
            📚 Explain a topic
        </div>

        <div class="suggestion" onclick="useSuggestion('Make important exam questions about photosynthesis.')">
            ❓ Important questions
        </div>

        <div class="suggestion" onclick="useSuggestion('Make short revision notes about chemical bonding.')">
            📝 Make revision notes
        </div>

    </div>

    <div class="chat" id="chat"></div>

    <div class="input-area">

        <div class="input-box">

            <textarea
                id="question"
                placeholder="Ask StudyForge anything..."
                rows="2"
            ></textarea>

            <button id="sendButton" onclick="askAI()">
                Ask
            </button>

        </div>

        <button class="clear-btn" onclick="clearChat()">
            Clear chat
        </button>

    </div>

</div>

<script>

    let credits = 10;

    const questionInput = document.getElementById("question");
    const chat = document.getElementById("chat");
    const creditsDisplay = document.getElementById("credits");
    const sendButton = document.getElementById("sendButton");
    const welcome = document.getElementById("welcome");
    const suggestions = document.getElementById("suggestions");

    function updateCredits() {
        creditsDisplay.textContent = credits;

        if (credits <= 0) {
            sendButton.disabled = true;
            questionInput.disabled = true;
            questionInput.placeholder = "No free questions remaining.";
        }
    }

    function addMessage(text, type) {
        const message = document.createElement("div");

        message.className = `message ${type}-message`;
        message.textContent = text;

        chat.appendChild(message);

        chat.scrollTop = chat.scrollHeight;

        return message;
    }

    function useSuggestion(text) {
        if (credits <= 0) {
            return;
        }

        questionInput.value = text;
        questionInput.focus();
    }

    async function askAI() {

        const question = questionInput.value.trim();

        if (!question) {
            return;
        }

        if (credits <= 0) {
            return;
        }

        addMessage(question, "user");

        questionInput.value = "";

        welcome.style.display = "none";
        suggestions.style.display = "none";

        sendButton.disabled = true;
        questionInput.disabled = true;

        const loadingMessage = addMessage(
            "StudyForge is thinking...",
            "ai"
        );

        loadingMessage.classList.add("loading");

        try {

            const response = await fetch("/api/ask", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    question: question
                })

            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error || "Something went wrong."
                );
            }

            loadingMessage.remove();

            addMessage(
                data.answer,
                "ai"
            );

            credits--;

            updateCredits();

        } catch (error) {

            loadingMessage.remove();

            addMessage(
                "Sorry, something went wrong while asking StudyForge.",
                "ai"
            );

        } finally {

            if (credits > 0) {
                sendButton.disabled = false;
                questionInput.disabled = false;
            }

            questionInput.focus();
        }
    }

    function clearChat() {

        chat.innerHTML = "";

        welcome.style.display = "block";
        suggestions.style.display = "grid";
    }

    questionInput.addEventListener("keydown", function(event) {

        if (event.key === "Enter" && !event.shiftKey) {

            event.preventDefault();

            askAI();
        }

    });

    updateCredits();

</script>

</body>
</html>
